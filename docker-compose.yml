services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${BACKEND_PORT:-3001}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    environment:
      - PORT=${BACKEND_PORT:-3001}
      - SIGNAL_API_URL=${SIGNAL_API_URL:-http://localhost:8080}
      - CONTACT_STORE=${CONTACT_STORE:-redis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      # Persist WhatsApp auth state
      - baileys_auth:/app/baileys_auth_info
    networks:
      - app-network
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - PORT=${CLIENT_PORT:-3000}
        - REACT_APP_API_URL=${BACKEND_URL:-http://localhost:3001}
    ports:
      - "${CLIENT_PORT:-3000}:${CLIENT_PORT:-3000}"
    environment:
      - PORT=${CLIENT_PORT:-3000}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  signal-api:
    image: bbernhard/signal-cli-rest-api
    ports:
      - "${SIGNAL_API_PORT:-8081}:8080"
    environment:
      - MODE=json-rpc
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  baileys_auth:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
